99;6uautogenerated = 0

# Autostart
exec-once = noctalia-shell

# Environment
env = QT_QPA_PLATFORMTHEME,hyprqt6engine
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = QT_QPA_PLATFORM,wayland;xcb

# XWayland Anti-Blur Configuration
xwayland {
    force_zero_scaling = true
}

# Variables
$mainMod = SUPER
$terminal = ghostty
$fileManager = yazi
$menu = noctalia-shell msg launcher toggle
$discord = Discord
$gestureHelper = /home/pavelzaikin/.config/hypr/gesture-helper.py

# Application Binds
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, T, exec, AyuGram
bind = $mainMod, V, togglefloating
bind = $mainMod, K, exec, kate
bind = $mainMod, F, exec, firefox
bind = $mainMod, C, exec, zeditor
bind = $mainMod, D, exec, $discord
bind = $mainMod, Z, exec, code
bind = $mainMod, X, exec, yandex-music
bind = $mainMod, O, exec, /home/pavelzaikin/Downloads/osu.AppImage
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = ALT, Tab, cyclenext

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2

# Touchpad gestures
gesture = 4, left, dispatcher, exec, python3 $gestureHelper previous
gesture = 4, right, dispatcher, exec, python3 $gestureHelper next
gesture = 3, up, dispatcher, exec, python3 $gestureHelper close-under-cursor
gesture = 3, down, dispatcher, exec, ghostty

# Screenshots
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Mouse Binds (ЛКМ — Resize, ПКМ — Move)
bindm = $mainMod, mouse:272, resizewindow
bindm = $mainMod, mouse:273, movewindow

# Audio
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Monitors
# monitor = HDMI-A-1, 1920x1080@120, 0x0, 1
monitor = eDP-1, 1920x1080@60, 0x0, 1

# General
general {
    border_size = 0
    gaps_out = 1
    resize_on_border = true
}

# Keyboard and Input
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    sensitivity = 0.3
    accel_profile = flat
}

# Devices
device {
    name = razer-razer-basilisk-v3
    sensitivity = 0.6
    accel_profile = flat
}
